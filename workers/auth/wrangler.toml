name = "sakamichi-auth"
main = "src/index.ts"
compatibility_date = "2024-05-01"

[vars]
CORS_ORIGIN = "https://46log.com,https://sakamichi-tools.cn,https://test.sakamichi-tools.cn,https://sakamichi-platform-test.pages.dev"
EMAIL_FROM = "noreply@sakamichi-tools.cn"
DISCORD_INVITE_URL = "https://discord.gg/Ddp8As4JA"
# JWT_SECRET, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN, etc.
# are set via `wrangler secret put <KEY>`.
# Discord role sync also requires:
# DISCORD_GUILD_ID, DISCORD_ROLE_NOGIZAKA, DISCORD_ROLE_SAKURAZAKA,
# DISCORD_ROLE_HINATAZAKA. These IDs are not sensitive, but keeping them in
# Worker secrets avoids publishing server internals in git.

[[d1_databases]]
binding = "DB"
database_name = "sakamichi-auth"
database_id = "3fb05a7a-13bc-4f0c-8e30-31ac07eff235"

[[d1_databases]]
binding = "MIGURI_DB"
database_name = "miguri"
database_id = "969491b9-4960-4e5a-ab2d-37fa8e457b67"
# TODO: remove this binding after Miguri Google Calendar OAuth is moved off
# /api/auth/callback/google to a miguri-owned redirect URI.

# Routes: auth Worker owns auth/user/manage(付费/邀请码/认证)/webhook 前缀。
# 2026-07-05 拆分：/api/miguri/* + /api/manage/miguri/* → sakamichi-miguri,
#                /api/community/* + /api/repo/* + /api/manage/reports* → sakamichi-community
# （更具体的 pattern 优先级更高，/api/manage/* 仍归 auth）
[[routes]]
pattern = "api.sakamichi-tools.cn/api/auth/*"
zone_name = "sakamichi-tools.cn"

[[routes]]
pattern = "api.sakamichi-tools.cn/api/user/*"
zone_name = "sakamichi-tools.cn"

[[routes]]
pattern = "api.46log.com/api/auth/*"
zone_name = "46log.com"

[[routes]]
pattern = "api.46log.com/api/user/*"
zone_name = "46log.com"

[[routes]]
pattern = "api.46log.com/api/manage/*"
zone_name = "46log.com"

[[routes]]
pattern = "api.46log.com/api/webhook/*"
zone_name = "46log.com"

[[routes]]
pattern = "api.sakamichi-tools.cn/api/manage/*"
zone_name = "sakamichi-tools.cn"

[[routes]]
pattern = "api.sakamichi-tools.cn/api/webhook/*"
zone_name = "sakamichi-tools.cn"

[triggers]
crons = ["0 3 * * *"]  # Daily at 03:00 UTC (12:00 JST)

