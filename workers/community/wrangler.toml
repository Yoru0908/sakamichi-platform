name = "sakamichi-community"
main = "src/index.ts"
compatibility_date = "2024-05-01"

[vars]
CORS_ORIGIN = "https://46log.com,https://sakamichi-tools.cn,https://test.sakamichi-tools.cn,https://sakamichi-platform-test.pages.dev"
ALIST_URL = "https://gallery.46log.com"
# Secrets (wrangler secret put): JWT_SECRET, ALIST_USER, ALIST_PASS

# auth D1 — shared with sakamichi-auth (users + community_works/repo_works/reports)
[[d1_databases]]
binding = "DB"
database_name = "sakamichi-auth"
database_id = "3fb05a7a-13bc-4f0c-8e30-31ac07eff235"

# Routes: more-specific patterns win over sakamichi-auth's /api/manage/*
[[routes]]
pattern = "api.46log.com/api/community/*"
zone_name = "46log.com"

[[routes]]
pattern = "api.46log.com/api/repo/*"
zone_name = "46log.com"

[[routes]]
pattern = "api.46log.com/api/report"
zone_name = "46log.com"

[[routes]]
pattern = "api.46log.com/api/manage/reports*"
zone_name = "46log.com"

[[routes]]
pattern = "api.sakamichi-tools.cn/api/community/*"
zone_name = "sakamichi-tools.cn"

[[routes]]
pattern = "api.sakamichi-tools.cn/api/repo/*"
zone_name = "sakamichi-tools.cn"

[[routes]]
pattern = "api.sakamichi-tools.cn/api/report"
zone_name = "sakamichi-tools.cn"

[[routes]]
pattern = "api.sakamichi-tools.cn/api/manage/reports*"
zone_name = "sakamichi-tools.cn"
